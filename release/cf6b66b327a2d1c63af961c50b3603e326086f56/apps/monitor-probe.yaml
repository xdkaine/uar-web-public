apiVersion: v1
kind: Service
metadata:
  name: monitor-probe
spec:
  type: ClusterIP
  selector:
    app: monitor-probe
  ports:
  - name: tcp
    port: 8091
    targetPort: 8091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-probe
  template:
    metadata:
      labels:
        app: monitor-probe
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: monitor-probe
        image: ghcr.io/xdkaine/uar-web-public-monitor@sha256:cb8c318a3343e6c0436c5d4c495ea28eefc43e3cccbdd59cf557f02809f22ec2
        ports:
        - containerPort: 8091
        env:
        - name: MONITOR_PROBE_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: uar-portal-runtime
              key: MONITOR_PROBE_SHARED_SECRET
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8091
