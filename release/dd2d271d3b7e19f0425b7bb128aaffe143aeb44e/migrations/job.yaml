apiVersion: batch/v1
kind: Job
metadata:
  name: uar-migrate-dd2d271d3b7e19f0425b7bb128aaffe143aeb44e
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: migration
        uar.dev/release: dd2d271d3b7e19f0425b7bb128aaffe143aeb44e
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate-and-verify
        image: ghcr.io/xdkaine/uar-web-public-portal-migrate@sha256:0759dac313ed9bb168ab4902db8c568561c576ff6065d909dbde3c9a6332bef5
        command:
        - node
        - /release/run-release.cjs
        env:
        - name: PGHOST
          value: postgres.uar-dev.svc.cluster.local
        - name: PGPORT
          value: '5432'
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /etc/uar/database-tls/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/uar/database-tls/ca.crt
        - name: PGOPTIONS
          value: -c client_min_messages=warning
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: uar-database-admin
              key: POSTGRES_DB
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: uar-database-admin
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: uar-database-admin
              key: POSTGRES_PASSWORD
        - name: PORTAL_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uar-migration
              key: PORTAL_DATABASE_PASSWORD
        - name: AUTH_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uar-migration
              key: AUTH_DATABASE_PASSWORD
        - name: MIGRATION_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uar-migration
              key: MIGRATION_DATABASE_PASSWORD
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: uar-migration
              key: DATABASE_URL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: database-ca
          mountPath: /etc/uar/database-tls
          readOnly: true
        - name: release
          mountPath: /release
          readOnly: true
      volumes:
      - name: database-ca
        secret:
          secretName: uar-database-ca
      - name: release
        configMap:
          name: uar-release-migration
