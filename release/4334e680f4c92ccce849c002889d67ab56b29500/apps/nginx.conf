user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    # Keep in sync with edge proxy limit; evidence uploads allowed up to 25MB
    # end-to-end. Effective limit: 25 MB (matches docs/deploy/nginx-auth.example.conf).
    client_max_body_size 25m;
    client_body_timeout 30s;

    # The shared secret is a 64-character hex string used as a map entry;
    # nginx's default map_hash_bucket_size (64) cannot hold it.
    map_hash_bucket_size 128;

    map $http_x_asset_token $token_ok {
        default 0;
        "__ASSET_SHARED_SECRET__" 1;
    }

    server {
        listen 8090;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /ingest/ {
            if ($token_ok = 0) { return 403; }
            limit_except PUT DELETE { deny all; }
            dav_methods PUT DELETE;
            alias /var/lib/assets/;
            create_full_put_path on;
            dav_access user:rw;
            autoindex off;
        }

        location /assets/ {
            if ($token_ok = 0) { return 403; }
            limit_except GET HEAD { deny all; }
            alias /var/lib/assets/;
            autoindex off;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "private, no-store" always;
        }

        location / {
            return 404;
        }
    }
}
