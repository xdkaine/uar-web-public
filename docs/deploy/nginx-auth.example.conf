# Example reverse-proxy configuration (nginx) for the UAR portal + auth service
#
# Compose publishes services on HOST LOOPBACK ports only; this proxy terminates
# TLS and provides name-based routing. Defaults target a DEV instance beside a
# prod installation on shared VMs:
#
#   portal-dev.calpolysoc.org -> 127.0.0.1:4002  (UAR portal dev, APP_PORT)
#   auth-dev.calpolysoc.org   -> 127.0.0.1:4003  (auth-service dev, AUTH_PORT)
#   portal.calpolysoc.org     -> prod instance (unchanged; keep existing block)
#
# Set TRUST_PROXY_HEADERS=true in .env so the apps honor X-Forwarded-*.
# X-Forwarded-For is OVERWRITTEN (not appended): the rightmost hop must be what
# THIS proxy observed, otherwise clients can spoof IPs into the auth-service
# login rate limiter and audit trail.
# Cookies are Secure + SameSite=Lax/Strict: both hostnames share one site
# level (*.calpolysoc.org), which the OIDC round-trip requires.
# Browser return on provider failure is best-effort: it can catch upstream
# HTTP 502/503/504 only after this proxy receives the request. Public DNS or
# TLS failure at auth-dev.calpolysoc.org happens first and cannot redirect.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name portal-dev.calpolysoc.org auth-dev.calpolysoc.org;
    return 301 https://$host$request_uri;
}

# ---- OIDC authentication service (dev) --------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name auth-dev.calpolysoc.org;

    ssl_certificate     /etc/nginx/certs/wildcard.calpolysoc.org.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.calpolysoc.org.key;

    # OIDC tokens/cookies are size-bounded but not tiny.
    client_max_body_size 1m;

    # The internal branding/client APIs are compose-network only. They
    # authenticate with shared secrets, but defense in depth: never expose
    # them to browsers. NOTE: /admin is DIFFERENT — it is the browser-facing
    # Auth Manager console and MUST stay proxied (location / below).
    # /session/backchannel-logout is called only by the portal over the
    # compose network via the internal issuer URL
    # (OIDC_INTERNAL_ISSUER_URL=http://auth-service:3003); it has no legitimate
    # public caller. It authenticates with timing-safe client credentials but
    # nothing throttles it, so exposing it here would create an unthrottled
    # online credential-check oracle. Deny it outright.
    # Non-standard topologies where the portal cannot reach the IdP internally:
    # apply the IdP's IP rate limiter to this handler instead of denying.
    location = /session/backchannel-logout {
        return 404;
    }

    location /internal/ {
        deny all;
    }

    # These are the browser-facing authorization/interaction routes. If the
    # upstream process is reachable through this public proxy but returns, or
    # causes nginx to return, 502/503/504, send the browser back to the portal.
    # The portal still authorizes only methods already enabled in its saved
    # sign-in policy. Do not apply this interception to token, JWKS, discovery,
    # logout, internal API, or Auth Manager traffic.
    location ~ ^/auth(?:/|$) {
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 503 504 =303 https://portal-dev.calpolysoc.org/login?error=oidc_unavailable;
        # Keep provider Location values byte-for-byte; AUTH_ISSUER owns the
        # public authority and nginx must not rewrite it to an upstream host.
        proxy_redirect off;
    }

    location ~ ^/interaction(?:/|$) {
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 503 504 =303 https://portal-dev.calpolysoc.org/login?error=oidc_unavailable;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        # Preserve external authorization response Location headers and the
        # RFC 9207 iss query parameter. AUTH_ISSUER must be the public URL.
        proxy_redirect off;
    }
}

# ---- UAR portal (dev) --------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name portal-dev.calpolysoc.org;

    ssl_certificate     /etc/nginx/certs/wildcard.calpolysoc.org.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.calpolysoc.org.key;

    # Keep in sync with asset-store limit; evidence uploads allowed up to 25MB
    # end-to-end. Effective limit: 25 MB (matches docker/asset-store/nginx.conf).
    # Ticket evidence uploads ingress through the portal (asset-store is internal).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
