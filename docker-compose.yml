    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${OPERATIONAL_DETECTOR_SCHEDULER_ENABLED}" != "true" ]; then
          while true; do sleep 86400; done
        fi
        if [ -z "$${CRON_SECRET}" ]; then exit 1; fi
        sleep 25
        while true; do
          if curl --fail --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $${CRON_SECRET}" \
            --request POST http://app:3002/api/cron/detect-operational-issues > /dev/null; then
            date +%s > /tmp/operational-detector-last-run
          fi
          sleep "$${OPERATIONAL_DETECTOR_INTERVAL_SECONDS}"
        done
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${OPERATIONAL_DETECTOR_SCHEDULER_ENABLED}" != "true" ]; then exit 0; fi;
          test -s /tmp/operational-detector-last-run || exit 1;
          now=$$(date +%s);
          last=$$(cat /tmp/operational-detector-last-run);
          [ "$$((now - last))" -le "$${OPERATIONAL_DETECTOR_HEALTH_MAX_AGE_SECONDS}" ]
