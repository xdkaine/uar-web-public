          if [ "$${PASSWORD_CLEANUP_SCHEDULER_ENABLED}" != "true" ]; then exit 0; fi;
          test -s /tmp/password-cleanup-last-success || exit 1;
          now=$$(date +%s);
          last=$$(cat /tmp/password-cleanup-last-success);
          age=$$((now - last));
          [ "$${age}" -le "$${PASSWORD_CLEANUP_HEALTH_MAX_AGE_SECONDS}" ]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 10m

  # Ticket group directory snapshot scheduler. Refreshes AD membership/mail
  # snapshots for allowed ticket groups so ticket forms and assignment
  # notifications never perform live LDAP searches (ADR-0007). Disabled by
  # default; the System Configuration page can also trigger syncs manually.
  ticket-group-sync-scheduler:
    image: curlimages/curl:8.12.1
    container_name: uar-${INSTANCE:-dev}-ticket-group-sync-scheduler
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      TICKET_GROUP_SYNC_ENABLED: ${TICKET_GROUP_SYNC_ENABLED:-false}
      TICKET_GROUP_SYNC_INTERVAL_SECONDS: ${TICKET_GROUP_SYNC_INTERVAL_SECONDS:-3600}
      TICKET_GROUP_SYNC_INITIAL_DELAY_SECONDS: ${TICKET_GROUP_SYNC_INITIAL_DELAY_SECONDS:-45}
      TICKET_GROUP_SYNC_HEALTH_MAX_AGE_SECONDS: ${TICKET_GROUP_SYNC_HEALTH_MAX_AGE_SECONDS:-14400}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - uar-network
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${TICKET_GROUP_SYNC_ENABLED}" != "true" ]; then
          echo "Ticket group sync scheduler disabled; set TICKET_GROUP_SYNC_ENABLED=true and recreate this service to activate it."
          while true; do sleep 86400; done
        fi
        if [ -z "$${CRON_SECRET}" ]; then
          echo "Ticket group sync scheduler cannot start because CRON_SECRET is empty."
          exit 1
        fi
        sleep "$${TICKET_GROUP_SYNC_INITIAL_DELAY_SECONDS}"
        while true; do
          if response="$$(curl --fail-with-body --silent --show-error \
              --max-time 240 \
              --header "Authorization: Bearer $${CRON_SECRET}" \
              --request POST \
              http://app:3002/api/cron/sync-ticket-groups)"; then
            date +%s > /tmp/ticket-group-sync-last-success
            printf '%s\n' "$${response}"
          else
            printf 'Ticket group sync request failed at %s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" >&2
          fi
          sleep "$${TICKET_GROUP_SYNC_INTERVAL_SECONDS}"
        done
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${TICKET_GROUP_SYNC_ENABLED}" != "true" ]; then exit 0; fi;
          test -s /tmp/ticket-group-sync-last-success || exit 1;
          now=$$(date +%s);
          last=$$(cat /tmp/ticket-group-sync-last-success);
          age=$$((now - last));
          [ "$${age}" -le "$${TICKET_GROUP_SYNC_HEALTH_MAX_AGE_SECONDS}" ]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 10m

  # Internal evidence/asset store (ADR-0010). Holds uploaded ticket evidence
  # on a dedicated volume. It publishes NO host ports and is reachable only on
  # the internal network; every request must carry the shared secret header,
  # and the Next.js app is the single ingress that performs authorization.
  asset-store:
    image: nginx:1.27-alpine
    container_name: uar-${INSTANCE:-dev}-asset-store
    environment:
      ASSET_SHARED_SECRET: ${ASSET_SHARED_SECRET:-}
    volumes:
      - ./docker/asset-store/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - asset_data:/var/lib/assets
    depends_on: []
    networks:
      - uar-network
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${ASSET_SHARED_SECRET}" ]; then
          echo "asset-store cannot start because ASSET_SHARED_SECRET is empty."
          exit 1
        fi
        sed "s/__ASSET_SHARED_SECRET__/$${ASSET_SHARED_SECRET}/" \
          /etc/nginx/nginx.conf.template > /tmp/nginx.conf
        exec nginx -g "daemon off;" -c /tmp/nginx.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Malware scanner for every managed upload. clamd is reachable only on the
  # internal Compose network; its unauthenticated TCP socket is never published.
  clamav:
    image: clamav/clamav:stable
    container_name: uar-${INSTANCE:-dev}-clamav
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - uar-network
    restart: unless-stopped

  # Retention runs independently from sign-in and from AUTH_DEVICE_RISK_MODE.
  # Work is bounded per pass; a backlog is reported and continued next pass.
  auth-device-evidence-maintenance:
    profiles: ["auth"]
    image: uar-auth:${INSTANCE:-dev}
    container_name: uar-${INSTANCE:-dev}-auth-device-maintenance
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}}
      AUTH_DEVICE_PURGE_INTERVAL_SECONDS: ${AUTH_DEVICE_PURGE_INTERVAL_SECONDS:-86400}
      AUTH_DEVICE_PURGE_RETRY_SECONDS: ${AUTH_DEVICE_PURGE_RETRY_SECONDS:-300}
      AUTH_DEVICE_PURGE_HEALTH_GRACE_SECONDS: ${AUTH_DEVICE_PURGE_HEALTH_GRACE_SECONDS:-900}
      AUTH_DEVICE_PURGE_BATCH_SIZE: ${AUTH_DEVICE_PURGE_BATCH_SIZE:-1000}
      AUTH_DEVICE_PURGE_MAX_BATCHES: ${AUTH_DEVICE_PURGE_MAX_BATCHES:-25}
    command: ["node", "dist/prune-device-observations.js", "--loop"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "dist/prune-device-observations.js", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Directory health probe scheduler (ADR-0008). Binds LDAPS and reads the
  # rootDSE on an interval; failures raise service alerts via configured
  # automation rules. Disabled by default like the other schedulers.
  directory-probe-scheduler:
    image: curlimages/curl:8.12.1
    container_name: uar-${INSTANCE:-dev}-directory-probe-scheduler
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      DIRECTORY_PROBE_ENABLED: ${DIRECTORY_PROBE_ENABLED:-false}
      DIRECTORY_PROBE_INTERVAL_SECONDS: ${DIRECTORY_PROBE_INTERVAL_SECONDS:-300}
      DIRECTORY_PROBE_INITIAL_DELAY_SECONDS: ${DIRECTORY_PROBE_INITIAL_DELAY_SECONDS:-60}
      DIRECTORY_PROBE_HEALTH_MAX_AGE_SECONDS: ${DIRECTORY_PROBE_HEALTH_MAX_AGE_SECONDS:-1800}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - uar-network
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${DIRECTORY_PROBE_ENABLED}" != "true" ]; then
          echo "Directory probe scheduler disabled; set DIRECTORY_PROBE_ENABLED=true and recreate this service to activate it."
          while true; do sleep 86400; done
        fi
        if [ -z "$${CRON_SECRET}" ]; then
          echo "Directory probe scheduler cannot start because CRON_SECRET is empty."
          exit 1
        fi
        sleep "$${DIRECTORY_PROBE_INITIAL_DELAY_SECONDS}"
        while true; do
          if response="$$(curl --fail-with-body --silent --show-error \
              --max-time 120 \
              --header "Authorization: Bearer $${CRON_SECRET}" \
              --request POST \
              http://app:3002/api/cron/probe-directory)"; then
            date +%s > /tmp/directory-probe-last-success
            printf '%s\n' "$${response}"
          else
            printf 'Directory probe request failed at %s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" >&2
          fi
          sleep "$${DIRECTORY_PROBE_INTERVAL_SECONDS}"
        done
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${DIRECTORY_PROBE_ENABLED}" != "true" ]; then exit 0; fi;
          test -s /tmp/directory-probe-last-success || exit 1;
          now=$$(date +%s);
          last=$$(cat /tmp/directory-probe-last-success);
          age=$$((now - last));
          [ "$${age}" -le "$${DIRECTORY_PROBE_HEALTH_MAX_AGE_SECONDS}" ]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 10m

  # Workflow tick worker (ADR-0013). Drains Wait-node timers and fires
  # schedule triggers every minute. Disabled by default like the other
  # schedulers so behavior is unchanged until operators opt in.
  workflow-tick-scheduler:
    image: curlimages/curl:8.12.1
    container_name: uar-${INSTANCE:-dev}-workflow-tick
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      WORKFLOW_TICK_ENABLED: ${WORKFLOW_TICK_ENABLED:-false}
      WORKFLOW_TICK_INTERVAL_SECONDS: ${WORKFLOW_TICK_INTERVAL_SECONDS:-60}
      WORKFLOW_TICK_HEALTH_MAX_AGE_SECONDS: ${WORKFLOW_TICK_HEALTH_MAX_AGE_SECONDS:-300}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - uar-network
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${WORKFLOW_TICK_ENABLED}" != "true" ]; then
          echo "Workflow tick disabled; set WORKFLOW_TICK_ENABLED=true to activate it."
          while true; do sleep 86400; done
        fi
        if [ -z "$${CRON_SECRET}" ]; then
          echo "Workflow tick cannot start because CRON_SECRET is empty."
          exit 1
        fi
        sleep 10
        while true; do
          if curl --fail --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $${CRON_SECRET}" \
            --request POST http://app:3002/api/cron/workflow-tick > /dev/null; then
            date +%s > /tmp/workflow-tick-last-run
          else
            printf 'Workflow tick request failed at %s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" >&2
          fi
          sleep "$${WORKFLOW_TICK_INTERVAL_SECONDS}"
        done
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${WORKFLOW_TICK_ENABLED}" != "true" ]; then exit 0; fi;
          test -s /tmp/workflow-tick-last-run || exit 1;
          now=$$(date +%s);
          last=$$(cat /tmp/workflow-tick-last-run);
          [ "$$((now - last))" -le "$${WORKFLOW_TICK_HEALTH_MAX_AGE_SECONDS}" ]
      interval: 30s
      timeout: 5s
      retries: 2

  monitored-endpoints-scheduler:
    image: curlimages/curl:8.12.1
