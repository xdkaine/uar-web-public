          echo "Monitored endpoints scheduler disabled."
          while true; do sleep 86400; done
        fi
        if [ -z "$${CRON_SECRET}" ]; then exit 1; fi
        sleep 30
        while true; do
          if curl --fail --silent --show-error --max-time 120 \
            --header "Authorization: Bearer $${CRON_SECRET}" \
            --request POST http://app:3002/api/cron/probe-monitored-endpoints > /dev/null; then
            date +%s > /tmp/monitored-endpoints-last-run
          fi
          sleep "$${MONITORED_ENDPOINTS_INTERVAL_SECONDS}"
