        if [ "$${PASSWORD_CLEANUP_SCHEDULER_ENABLED}" != "true" ]; then
          echo "Password cleanup scheduler disabled; set PASSWORD_CLEANUP_SCHEDULER_ENABLED=true and recreate this service to activate it."
          while true; do sleep 86400; done
