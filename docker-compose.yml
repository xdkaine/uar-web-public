          fi
          sleep "$${ATTACHMENT_QUARANTINE_PURGE_INTERVAL_SECONDS}"
        done
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${ATTACHMENT_QUARANTINE_PURGE_ENABLED}" != "true" ]; then exit 0; fi;
          test -s /tmp/attachment-quarantine-purge-last-run || exit 1;
          now=$$(date +%s);
          last=$$(cat /tmp/attachment-quarantine-purge-last-run);
          [ "$$((now - last))" -le "$${ATTACHMENT_QUARANTINE_PURGE_HEALTH_MAX_AGE_SECONDS}" ]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 10m

  flow-outbox-scheduler:
    image: curlimages/curl:8.12.1
    container_name: uar-${INSTANCE:-dev}-flow-outbox
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      FLOW_OUTBOX_SCHEDULER_ENABLED: ${FLOW_OUTBOX_SCHEDULER_ENABLED:-false}
      FLOW_OUTBOX_INTERVAL_SECONDS: ${FLOW_OUTBOX_INTERVAL_SECONDS:-60}
      FLOW_OUTBOX_HEALTH_MAX_AGE_SECONDS: ${FLOW_OUTBOX_HEALTH_MAX_AGE_SECONDS:-300}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - uar-network
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${FLOW_OUTBOX_SCHEDULER_ENABLED}" != "true" ]; then
          while true; do sleep 86400; done
        fi
        if [ -z "$${CRON_SECRET}" ]; then exit 1; fi
        sleep 20
        while true; do
          if curl --fail --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $${CRON_SECRET}" \
            --request POST http://app:3002/api/cron/drain-flow-outbox > /dev/null; then
            date +%s > /tmp/flow-outbox-last-run
          fi
          sleep "$${FLOW_OUTBOX_INTERVAL_SECONDS}"
        done
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${FLOW_OUTBOX_SCHEDULER_ENABLED}" != "true" ]; then exit 0; fi;
          test -s /tmp/flow-outbox-last-run || exit 1;
          now=$$(date +%s);
          last=$$(cat /tmp/flow-outbox-last-run);
          [ "$$((now - last))" -le "$${FLOW_OUTBOX_HEALTH_MAX_AGE_SECONDS}" ]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 5m

  operational-detector-scheduler:
    image: curlimages/curl:8.12.1
    container_name: uar-${INSTANCE:-dev}-operational-detector
    environment:
