        - >-
          if [ "$${MONITORED_ENDPOINTS_SCHEDULER_ENABLED}" != "true" ]; then exit 0; fi;
          test -s /tmp/monitored-endpoints-last-run || exit 1;
          now=$$(date +%s);
          last=$$(cat /tmp/monitored-endpoints-last-run);
          [ "$$((now - last))" -le "$${MONITORED_ENDPOINTS_HEALTH_MAX_AGE_SECONDS}" ]
