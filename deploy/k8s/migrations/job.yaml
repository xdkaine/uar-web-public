apiVersion: batch/v1
kind: Job
metadata:
  name: uar-migrate-release-id
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: migration
        uar.dev/release: RELEASE_ID
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: auth-migration-artifacts
        image: ghcr.io/xdkaine/auth-service-migrate@sha256:38dbdc3dcf3c5c253354d04ffee45dae9b92e5d9486d7a6a1ae84a19ab4a64a5
        command:
        - sh
        - -ec
        - cp -R /app/prisma /auth-migration/prisma; cp /app/prisma.config.ts /auth-migration/prisma.config.ts;
          node -e 'const fs=require("fs"); fs.writeFileSync("/auth-migration/prisma-version",
          require("/app/node_modules/prisma/package.json").version)'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: auth-migration
          mountPath: /auth-migration
      containers:
      - name: migrate-and-verify
        image: uar-portal-migrate:UNRELEASED
        command:
        - node
        - /release/run-release.cjs
        env:
        - name: PGHOST
          value: postgres.uar-dev.svc.cluster.local
        - name: PGPORT
          value: '5432'
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /etc/uar/database-tls/ca.crt
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/uar/database-tls/ca.crt
        - name: PGOPTIONS
          value: -c client_min_messages=warning
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: uar-database-admin
              key: POSTGRES_DB
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: uar-database-admin
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: uar-database-admin
              key: POSTGRES_PASSWORD
        - name: PORTAL_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uar-migration
              key: PORTAL_DATABASE_PASSWORD
        - name: AUTH_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uar-migration
              key: AUTH_DATABASE_PASSWORD
        - name: MIGRATION_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uar-migration
              key: MIGRATION_DATABASE_PASSWORD
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: uar-migration
              key: DATABASE_URL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: database-ca
          mountPath: /etc/uar/database-tls
          readOnly: true
        - name: release
          mountPath: /release
          readOnly: true
        - name: auth-migration
          mountPath: /app/auth-migration
      volumes:
      - name: database-ca
        secret:
          secretName: uar-database-ca
      - name: release
        configMap:
          name: uar-release-migration
      - name: auth-migration
        emptyDir: {}
