apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-dev-postgres
  namespace: uar-dev
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: auth-dev
      podSelector:
        matchLabels:
          app: auth
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-dev-redis
  namespace: uar-dev
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: auth-dev
      podSelector:
        matchLabels:
          app: auth
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-to-auth-dev
  namespace: uar-dev
spec:
  podSelector:
    matchLabels:
      app: portal
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: auth-dev
      podSelector:
        matchLabels:
          app: auth
    ports:
    - protocol: TCP
      port: 3003
