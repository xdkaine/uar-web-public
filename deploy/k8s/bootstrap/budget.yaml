apiVersion: v1
kind: ResourceQuota
metadata:
  name: uar-dev-budget
  namespace: uar-dev
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 6Gi
    limits.cpu: '12'
    limits.memory: 12Gi
    requests.storage: 8Gi
    persistentvolumeclaims: '4'
    pods: '18'
    services.nodeports: '0'
    services.loadbalancers: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: uar-dev-defaults
  namespace: uar-dev
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
