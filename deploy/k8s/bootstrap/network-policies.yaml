apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-dependencies
  namespace: uar-dev
spec:
  podSelector:
    matchLabels:
      app: portal
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - auth
    ports:
    - protocol: TCP
      port: 3003
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - asset-store
    ports:
    - protocol: TCP
      port: 8090
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - clamav
    ports:
    - protocol: TCP
      port: 3310
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - monitor-probe
    ports:
    - protocol: TCP
      port: 8091
---
