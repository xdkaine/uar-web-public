apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: uar-dev
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/xdkaine/uar-web-public.git
  ref:
    branch: deploy/dev
  timeout: 60s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uar-dev-release
  namespace: flux-system
spec:
  interval: 1m
  path: ./deploy/k8s/flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: uar-dev
  timeout: 2m
  wait: false
