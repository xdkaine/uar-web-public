apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: database-certificate
        image: postgres:16-alpine
        command:
        - sh
        - -ec
        - cp /source/tls.crt /tls/server.crt; cp /source/tls.key /tls/server.key;
          chown 70:70 /tls/server.crt /tls/server.key; chmod 600 /tls/server.key;
          chmod 644 /tls/server.crt
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: tls-source
          mountPath: /source
          readOnly: true
        - name: tls
          mountPath: /tls
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
        - -c
        - ssl=on
        - -c
        - ssl_cert_file=/tls/server.crt
        - -c
        - ssl_key_file=/tls/server.key
        - -c
        - hba_file=/etc/postgresql/pg_hba.conf
        envFrom:
        - secretRef:
            name: uar-database-admin
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 1536Mi
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 30
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: hba
          mountPath: /etc/postgresql
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: tls-source
        secret:
          secretName: uar-database-tls
          defaultMode: 256
      - name: tls
        emptyDir: {}
      - name: hba
        configMap:
          name: postgres-hba
